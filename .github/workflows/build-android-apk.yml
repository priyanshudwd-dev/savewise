name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Apna code le lo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Tumhara latest Flutter use karo (latest = sabse naye wala)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Gradle ready karo
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. APK banane ka command
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. APK download ke liye save karo
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
